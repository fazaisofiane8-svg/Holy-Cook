<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Holy Cook</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/brand/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #0b0805;
    --color-text: #f6f1ea;
    --color-text-muted: #cabfae;
    --color-gold: #f2b90c;
    --color-on-gold: #17110a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: "Manrope", system-ui, sans-serif;
    text-align: center;
    padding: 24px;
  }
  img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; }
  h1 {
    font-family: "Anton", sans-serif;
    text-transform: uppercase;
    font-size: clamp(2rem, 6vw, 3rem);
    margin: 0;
  }
  p { color: var(--color-text-muted); max-width: 40ch; margin: 0; }
  a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--color-gold);
    color: var(--color-on-gold);
    text-decoration: none;
    font-weight: 700;
    padding: 12px 24px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <img src="assets/brand/logo.jpg" alt="Holy Cook">
  <h1>Page introuvable</h1>
  <p>Cette page n'existe pas ou plus. La carte, les offres et nos coordonnées vous attendent sur l'accueil.</p>
  <a href="/Holy-Cook/">Retour à l'accueil</a>
</body>
</html>
