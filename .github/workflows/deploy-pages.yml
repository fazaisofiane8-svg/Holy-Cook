name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - claude/install-ui-ux-pro-max-skill-hqfkqg
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No `environment: github-pages` here on purpose: GitHub auto-creates that
    # environment restricted to the default branch, which silently rejects
    # deployments from this feature branch before a runner is even picked up.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site folder
        run: |
          mkdir -p _site
          cp -r index.html 404.html css js assets _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
